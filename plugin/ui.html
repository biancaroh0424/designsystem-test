<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px;
    color: #1a1a1a;
    background: #fff;
    height: 520px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 헤더 ─── */
  .header {
    padding: 14px 16px 0;
    border-bottom: 1px solid #e5e5e5;
  }
  .header h1 { font-size: 13px; font-weight: 600; margin-bottom: 10px; }

  /* ── 탭 ─── */
  .tabs { display: flex; gap: 2px; }
  .tab {
    padding: 6px 14px;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 12px;
    color: #666;
    border-bottom: 2px solid transparent;
    transition: all .15s;
  }
  .tab.active { color: #0d0d0d; border-bottom-color: #0d0d0d; font-weight: 500; }

  /* ── 본문 ─── */
  .content { flex: 1; overflow-y: auto; padding: 16px; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* ── 폼 ─── */
  .field { margin-bottom: 12px; }
  label { display: block; font-size: 11px; font-weight: 500; color: #444; margin-bottom: 4px; }
  input {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid #d4d4d4;
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
    color: #1a1a1a;
    outline: none;
    transition: border-color .15s;
  }
  input:focus { border-color: #0d0d0d; }
  input::placeholder { color: #aaa; }

  .hint { font-size: 10px; color: #999; margin-top: 3px; }

  /* ── 버튼 ─── */
  .btn-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .btn {
    flex: 1;
    padding: 9px;
    border: none;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    font-family: inherit;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: #0d0d0d; color: #fff; }
  .btn-secondary { background: #f0f0f0; color: #1a1a1a; }
  .btn-save { background: #0d0d0d; color: #fff; width: 100%; padding: 9px; border: none; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit; }

  /* ── 상태 로그 ─── */
  .log {
    background: #f7f7f7;
    border-radius: 8px;
    padding: 10px;
    min-height: 140px;
    max-height: 220px;
    overflow-y: auto;
    font-size: 11px;
    line-height: 1.6;
  }
  .log-entry { display: flex; gap: 8px; padding: 2px 0; }
  .log-entry .time { color: #999; flex-shrink: 0; }
  .log-entry.ok .msg { color: #12a05c; }
  .log-entry.err .msg { color: #e5343a; }
  .log-entry.info .msg { color: #444; }
  .log-empty { color: #bbb; text-align: center; padding: 20px 0; }

  /* ── 구분선 ─── */
  .divider { border: none; border-top: 1px solid #eee; margin: 14px 0; }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    color: #999;
    text-transform: uppercase;
    letter-spacing: .04em;
    margin-bottom: 10px;
  }

  /* ── 배지 ─── */
  .badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 99px;
    font-size: 10px;
    font-weight: 500;
  }
  .badge-green { background: #e6f9f0; color: #0a7a45; }
  .badge-gray  { background: #f0f0f0; color: #666; }

  /* ── 스피너 ─── */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid #ddd;
    border-top-color: #0d0d0d;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 4px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Token Sync 🔄</h1>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('sync')">Sync</button>
    <button class="tab" onclick="switchTab('settings')">Settings</button>
  </div>
</div>

<div class="content">

  <!-- ── Sync 패널 ── -->
  <div id="panel-sync" class="panel active">
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-push" onclick="push()">↑ Push to GitHub</button>
      <button class="btn btn-secondary" id="btn-pull" onclick="pull()">↓ Pull from GitHub</button>
    </div>
    <p style="font-size:10px;color:#999;margin-bottom:14px;line-height:1.5;">
      <b>Push</b>: Figma 변수 → GitHub design/tokens 브랜치<br>
      <b>Pull</b>: GitHub design/tokens 브랜치 → Figma 변수 업데이트
    </p>

    <div class="section-title">Log</div>
    <div class="log" id="log">
      <div class="log-empty">아직 동기화 기록이 없어요</div>
    </div>
  </div>

  <!-- ── Settings 패널 ── -->
  <div id="panel-settings" class="panel">
    <div class="field">
      <label>GitHub Personal Access Token</label>
      <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx" />
      <div class="hint">Settings → Developer settings → Personal access tokens (Contents: Read & write)</div>
    </div>
    <div class="field">
      <label>Repository</label>
      <input type="text" id="gh-repo" placeholder="biancaroh0424/designsystem-test" />
    </div>
    <div class="field">
      <label>Branch</label>
      <input type="text" id="gh-branch" placeholder="design/tokens" />
    </div>
    <div class="field">
      <label>Token folder path</label>
      <input type="text" id="gh-path" placeholder="tokens" />
    </div>
    <button class="btn-save" onclick="saveSettings()">저장</button>
    <div id="save-msg" style="text-align:center;font-size:11px;color:#12a05c;margin-top:8px;min-height:16px;"></div>
  </div>

</div>

<script>
// ── 상태 ──────────────────────────────────────────────────────────────────────
let settings = {};
let busy = false;

// ── 탭 전환 ───────────────────────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['sync','settings'][i] === name);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`panel-${name}`).classList.add('active');
}

// ── 로그 ──────────────────────────────────────────────────────────────────────
function log(msg, type = 'info') {
  const logEl = document.getElementById('log');
  const empty = logEl.querySelector('.log-empty');
  if (empty) empty.remove();

  const now = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const entry = document.createElement('div');
  entry.className = `log-entry ${type}`;
  entry.innerHTML = `<span class="time">${now}</span><span class="msg">${msg}</span>`;
  logEl.prepend(entry);
}

function setLoading(on) {
  busy = on;
  ['btn-push','btn-pull'].forEach(id => {
    document.getElementById(id).disabled = on;
  });
}

// ── GitHub API ────────────────────────────────────────────────────────────────
async function ghRequest(path, method = 'GET', body = null) {
  const url = `https://api.github.com/repos/${settings.repo}${path}`;
  const opts = {
    method,
    headers: {
      'Authorization': `token ${settings.token}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json',
    },
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `GitHub API ${res.status}`);
  }
  return res.status === 204 ? null : res.json();
}

// 재귀적으로 tokens/ 디렉토리 읽기
async function readTokenDir(dirPath) {
  const items = await ghRequest(`/contents/${dirPath}?ref=${settings.branch}`);
  const result = {};
  for (const item of items) {
    if (item.name.startsWith('$')) continue;
    if (item.type === 'dir') {
      const sub = await readTokenDir(item.path);
      for (const [k, v] of Object.entries(sub)) result[k] = v;
    } else if (item.name.endsWith('.json')) {
      const file = await ghRequest(`/contents/${item.path}?ref=${settings.branch}`);
      const content = JSON.parse(atob(file.content.replace(/\n/g, '')));
      // 컬렉션 키: "tokens/global/color.json" → "global/color"
      const key = item.path
        .replace(`${settings.path}/`, '')
        .replace('.json', '');
      result[key] = content;
    }
  }
  return result;
}

// ── Push (Figma → GitHub) ──────────────────────────────────────────────────────
async function push() {
  if (busy) return;
  if (!validate()) return;

  setLoading(true);
  log('Figma 변수 + 컴포넌트 읽는 중...', 'info');

  // 변수 먼저 읽기 → 완료 후 컴포넌트 읽기 (onmessage에서 순차 처리)
  parent.postMessage({ pluginMessage: { type: 'READ_VARIABLES' } }, '*');
}

// 변수 push 완료 후 컴포넌트 push
async function doPush(tokens) {
  try {
    const collections = Object.entries(tokens);
    log(`토큰 ${collections.length}개 컬렉션 비교 중...`, 'info');

    let changed = 0;
    for (const [key, tokenData] of collections) {
      const filePath = `${settings.path}/${key}.json`;
      const newContent = JSON.stringify(tokenData, null, 2) + '\n';

      // 기존 파일 내용 가져와서 비교
      let existingSha = null;
      let existingContent = null;
      try {
        const ex = await ghRequest(`/contents/${filePath}?ref=${settings.branch}`);
        existingSha = ex.sha;
        existingContent = decodeURIComponent(escape(atob(ex.content.replace(/\n/g, ''))));
      } catch (_) {}

      // 내용이 같으면 스킵
      if (existingContent === newContent) {
        log(`⏭ tokens/${key}.json 변경 없음`, 'info');
        continue;
      }

      const encoded = btoa(unescape(encodeURIComponent(newContent)));
      const body = { message: `chore: update ${key} tokens from Figma [skip-figma-sync]`, content: encoded, branch: settings.branch };
      if (existingSha) body.sha = existingSha;
      await ghRequest(`/contents/${filePath}`, 'PUT', body);
      log(`✅ tokens/${key}.json 업데이트됨`, 'ok');
      changed++;
    }

    if (changed === 0) {
      log('✨ 토큰 변경사항 없음', 'info');
    }

    // 이어서 컴포넌트 읽기
    log('Figma 컴포넌트 비교 중...', 'info');
    parent.postMessage({ pluginMessage: { type: 'READ_COMPONENTS' } }, '*');
  } catch (e) {
    log(`❌ ${e.message}`, 'err');
    setLoading(false);
  }
}

async function doPushComponents(components) {
  try {
    const groups = Object.keys(components);
    let totalCount = 0;
    for (const g of groups) totalCount += components[g].length;

    if (totalCount === 0) {
      log('⚠️  Figma에 컴포넌트가 없어요.', 'err');
      setLoading(false);
      return;
    }

    log(`컴포넌트 ${totalCount}개 비교 중...`, 'info');

    // 1) 스펙 JSON — 변경된 경우만 저장
    const specPath = 'components/specs/components.json';
    const newSpecContent = JSON.stringify(components, null, 2) + '\n';
    let specSha = null, existingSpec = null;
    try {
      const ex = await ghRequest(`/contents/${specPath}?ref=${settings.branch}`);
      specSha = ex.sha;
      existingSpec = decodeURIComponent(escape(atob(ex.content.replace(/\n/g, ''))));
    } catch (_) {}

    if (existingSpec === newSpecContent) {
      log('⏭ components/specs/components.json 변경 없음', 'info');
    } else {
      const specBody = { message: 'chore: update component specs from Figma [skip-figma-sync]', content: btoa(unescape(encodeURIComponent(newSpecContent))), branch: settings.branch };
      if (specSha) specBody.sha = specSha;
      await ghRequest(`/contents/${specPath}`, 'PUT', specBody);
      log(`✅ components/specs/components.json 업데이트됨`, 'ok');
    }

    // 2) React 스텁 생성 + 저장
    for (const [group, comps] of Object.entries(components)) {
      for (const comp of comps) {
        const fileName = comp.name.replace(/\s+/g, '');
        const filePath = `components/src/${fileName}.tsx`;
        const tsxContent = generateReactStub(comp);
        const encoded = btoa(unescape(encodeURIComponent(tsxContent)));
        let sha;
        try { const ex = await ghRequest(`/contents/${filePath}?ref=${settings.branch}`); sha = ex.sha; } catch (_) {}
        // 이미 있으면 덮어쓰지 않음 (개발자가 폴리싱한 코드 보호)
        if (!sha) {
          const body = { message: `feat: add ${comp.name} component stub [skip-figma-sync]`, content: encoded, branch: settings.branch };
          await ghRequest(`/contents/${filePath}`, 'PUT', body);
          log(`✅ components/src/${fileName}.tsx 생성됨`, 'ok');
        } else {
          log(`⏭ components/src/${fileName}.tsx 이미 있음 (스킵)`, 'info');
        }
      }
    }

    log('🚀 Push 완료! 프리뷰가 곧 업데이트돼요.', 'ok');
  } catch (e) {
    log(`❌ ${e.message}`, 'err');
  } finally {
    setLoading(false);
  }
}

function generateReactStub(comp) {
  const compName = comp.name.replace(/\s+/g, '');

  // Props 타입 생성
  const propLines = [];
  for (const v of comp.variants) {
    const union = v.values.map(val => `'${val}'`).join(' | ');
    propLines.push(`  ${toCamel(v.name)}?: ${union};`);
  }
  for (const p of comp.props) {
    if (p.type === 'BOOLEAN') propLines.push(`  ${toCamel(p.name)}?: boolean;`);
    else if (p.type === 'TEXT') propLines.push(`  ${toCamel(p.name)}?: string;`);
    else if (p.type === 'INSTANCE_SWAP') propLines.push(`  ${toCamel(p.name)}?: React.ReactNode;`);
  }
  propLines.push('  className?: string;');
  propLines.push('  onClick?: () => void;');

  // 기본값
  const defaultLines = [];
  for (const v of comp.variants) {
    if (v.values[0]) defaultLines.push(`  ${toCamel(v.name)} = '${v.values[0]}',`);
  }
  for (const p of comp.props) {
    if (p.defaultValue) {
      if (p.type === 'BOOLEAN') defaultLines.push(`  ${toCamel(p.name)} = ${p.defaultValue === 'true'},`);
      else if (p.type === 'TEXT') defaultLines.push(`  ${toCamel(p.name)} = '${p.defaultValue}',`);
    }
  }

  const propsInterface = propLines.length ? `\ninterface ${compName}Props {\n${propLines.join('\n')}\n}\n` : '';
  const propsArg = defaultLines.length
    ? `{\n  ${defaultLines.join('\n  ')}\n  className,\n  onClick,\n}: ${compName}Props`
    : `{}: ${compName}Props`;

  return `import React from 'react';
import styles from './${compName}.module.css';
${propsInterface}
/**
 * ${comp.name}
 * ${comp.description || 'Auto-generated from Figma. Polish as needed.'}
 * @figma ${comp.width}×${comp.height}
 */
export const ${compName}: React.FC<${compName}Props> = (${propsArg}) => {
  return (
    <div
      className={[styles.root, className].filter(Boolean).join(' ')}
      onClick={onClick}
      data-component="${comp.name}"
    >
      {/* TODO: implement ${comp.name} */}
    </div>
  );
};

export default ${compName};
`;
}

function toCamel(str) {
  return str.replace(/[-_\s]+(.)/g, (_, c) => c.toUpperCase()).replace(/^(.)/, c => c.toLowerCase());
}

// ── Pull (GitHub → Figma) ──────────────────────────────────────────────────────
async function pull() {
  if (busy) return;
  if (!validate()) return;

  setLoading(true);
  log('GitHub에서 토큰 읽는 중...', 'info');

  try {
    const tokens = await readTokenDir(settings.path);
    const count = Object.keys(tokens).length;

    if (count === 0) {
      log('⚠️  GitHub에 토큰 파일이 없어요.', 'err');
      setLoading(false);
      return;
    }

    log(`${count}개 컬렉션 발견 → Figma에 쓰는 중...`, 'info');
    parent.postMessage({ pluginMessage: { type: 'WRITE_VARIABLES', tokens } }, '*');
  } catch (e) {
    log(`❌ ${e.message}`, 'err');
    setLoading(false);
  }
}

// ── 설정 ──────────────────────────────────────────────────────────────────────
function validate() {
  const missing = [];
  if (!settings.token) missing.push('GitHub Token');
  if (!settings.repo)  missing.push('Repository');
  if (missing.length) {
    log(`❌ Settings에서 먼저 입력해주세요: ${missing.join(', ')}`, 'err');
    switchTab('settings');
    return false;
  }
  return true;
}

function saveSettings() {
  const data = {
    token:  document.getElementById('gh-token').value.trim(),
    repo:   document.getElementById('gh-repo').value.trim(),
    branch: document.getElementById('gh-branch').value.trim() || 'design/tokens',
    path:   document.getElementById('gh-path').value.trim() || 'tokens',
  };
  settings = data;
  parent.postMessage({ pluginMessage: { type: 'SAVE_SETTINGS', data } }, '*');
}

function loadSettingsToForm(data) {
  settings = data;
  document.getElementById('gh-token').value  = data.token  ?? '';
  document.getElementById('gh-repo').value   = data.repo   ?? 'biancaroh0424/designsystem-test';
  document.getElementById('gh-branch').value = data.branch ?? 'design/tokens';
  document.getElementById('gh-path').value   = data.path   ?? 'tokens';
}

// ── Figma plugin 메시지 수신 ──────────────────────────────────────────────────
window.onmessage = (event) => {
  const msg = event.data.pluginMessage;
  if (!msg) return;

  switch (msg.type) {
    case 'SETTINGS':
      loadSettingsToForm(msg.data);
      break;

    case 'SETTINGS_SAVED':
      document.getElementById('save-msg').textContent = '✅ 저장됐어요!';
      setTimeout(() => document.getElementById('save-msg').textContent = '', 2000);
      break;

    case 'VARIABLES_DATA':
      doPush(msg.tokens);
      break;

    case 'COMPONENTS_DATA':
      doPushComponents(msg.components);
      break;

    case 'WRITE_DONE':
      log(`✅ Pull 완료! ${msg.created}개 생성, ${msg.updated}개 업데이트됐어요.`, 'ok');
      setLoading(false);
      break;

    case 'ERROR':
      log(`❌ ${msg.message}`, 'err');
      setLoading(false);
      break;
  }
};

// 초기 설정 로드
parent.postMessage({ pluginMessage: { type: 'LOAD_SETTINGS' } }, '*');
</script>
</body>
</html>

name: Build & PR to main

on:
  push:
    branches:
      - design/tokens
    paths:
      - "tokens/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/tokens

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Build tokens (Style Dictionary)
        run: npm run build:tokens

      - name: Create PR to main
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: chore/token-sync-${{ github.sha }}
          title: "🎨 Design token update from Figma"
          body: |
            Figma에서 변경된 토큰이 자동 반영되었습니다.

            - `tokens/` — 원본 JSON
            - `dist/css/tokens.css` — CSS 변수
            - `dist/js/tokens.js` — JS/TS 모듈

            > 프론트엔드에서 검토 후 merge 해주세요.
          commit-message: "chore: sync design tokens from Figma"
          labels: design-tokens
          delete-branch: true

name: Sync tokens → Figma

on:
  push:
    branches:
      - design/tokens
    paths:
      - "tokens/**"

# Figma에서 온 커밋([skip-figma-sync] 태그)은 다시 Figma로 보내지 않음

jobs:
  sync-to-figma:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-figma-sync]')"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/tokens

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update Figma variables
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          FIGMA_FILE_KEY: ${{ secrets.FIGMA_FILE_KEY }}
        run: node scripts/tokens-to-figma.js
